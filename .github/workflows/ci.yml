name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  application:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
        env:
          # Generic Intel CI validates Rust without pretending it can package
          # the Apple Silicon-only external binaries.
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'

  sidecar-contract:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.19'
      - run: python -m pip install --disable-pip-version-check pillow==12.3.0 pypdfium2==5.13.0
      - run: python -m unittest discover -s tools/ocr-sidecar/tests -p 'test_*.py' -v
