name: OCR ARM64 build

on:
  workflow_dispatch:
  push:
    tags: ['ocr-v*']

jobs:
  package-and-smoke:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/bootstrap-macos.sh
        env:
          AGENTIC_OS_OCR_PYTHON: ${{ vars.AGENTIC_OS_OCR_PYTHON }}
      - run: pnpm test:ocr
      - run: pnpm check:ocr
      - run: pnpm check:native
      - run: pnpm build:desktop
        env:
          AGENT_CONTROL_INSTALL_DIR: ${{ runner.temp }}/agentic-os-install
          APPLE_SIGNING_IDENTITY: '-'
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-os-arm64-unsigned
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
